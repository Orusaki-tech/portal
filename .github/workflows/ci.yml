name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: realitysync_test
          POSTGRES_USER: realitysync
          POSTGRES_PASSWORD: realitysync
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-core.txt
          pip install pytest pytest-cov psycopg2-binary

      - name: Apply migrations
        run: python database/run_migrations.py
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: realitysync_test
          DB_USER: realitysync
          DB_PASSWORD: realitysync

      - name: Run tests
        run: python -m pytest tests/unit/ tests/e2e/ -v --tb=short
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: realitysync_test
          DB_USER: realitysync
          DB_PASSWORD: realitysync

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lint deps
        run: pip install ruff mypy
      - name: Ruff check
        run: ruff check backend/
      - name: MyPy check
        run: mypy backend/ --ignore-missing-imports || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
