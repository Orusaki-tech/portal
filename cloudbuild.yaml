steps:
  # ── 1. API Backend ────────────────────────────────────────────
  - id: build-and-push-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker-credential-gcr configure-docker --registries=us-central1-docker.pkg.dev 2>&1 || true
        docker build -f Dockerfile \
          -t $_ARTIFACT_REGISTRY/realitysync-api:$BUILD_ID \
          -t $_ARTIFACT_REGISTRY/realitysync-api:latest \
          .
        docker push $_ARTIFACT_REGISTRY/realitysync-api:latest 2>&1
        docker push $_ARTIFACT_REGISTRY/realitysync-api:$BUILD_ID 2>&1
    waitFor: ["-"]

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy realitysync-api \
          --image $_ARTIFACT_REGISTRY/realitysync-api:latest \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --add-cloudsql-instances $_CLOUD_SQL_INSTANCE \
          --set-env-vars "DB_HOST=/cloudsql/$_CLOUD_SQL_INSTANCE,DB_NAME=realitysync,APP_ENV=production" \
          --set-secrets "DB_USER=realitysync-db-user:latest,DB_PASSWORD=realitysync-db-password:latest" \
          --min-instances 0 \
          --max-instances 10 \
          --timeout 5m
    waitFor: ["build-and-push-api"]

  # ── 2. TiTiler ────────────────────────────────────────────────
  - id: build-and-push-titiler
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker-credential-gcr configure-docker --registries=us-central1-docker.pkg.dev 2>&1 || true
        docker build -f backend/titiler/Dockerfile \
          -t $_ARTIFACT_REGISTRY/realitysync-titiler:$BUILD_ID \
          -t $_ARTIFACT_REGISTRY/realitysync-titiler:latest \
          .
        docker push $_ARTIFACT_REGISTRY/realitysync-titiler:latest
        docker push $_ARTIFACT_REGISTRY/realitysync-titiler:$BUILD_ID
    waitFor: ["build-and-push-api"]

  - id: deploy-titiler
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy realitysync-titiler \
          --image $_ARTIFACT_REGISTRY/realitysync-titiler:latest \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --min-instances 0 \
          --max-instances 5 \
          --timeout 5m
    waitFor: ["build-and-push-titiler"]

  # ── 3. Frontend (Next.js) ─────────────────────────────────────
  - id: get-api-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(gcloud run services describe realitysync-api \
          --region $_REGION \
          --format='value(status.url)')
        echo "API_URL=$$API_URL" >> /workspace/build.env
        echo "NEXT_PUBLIC_API_URL=$$API_URL" >> /workspace/build.env
    waitFor: ["deploy-api"]

  - id: build-and-push-frontend
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker-credential-gcr configure-docker --registries=us-central1-docker.pkg.dev 2>&1 || true
        API_URL=$$(grep ^API_URL= /workspace/build.env | cut -d= -f2-)
        NEXT_PUBLIC_API_URL=$$(grep ^NEXT_PUBLIC_API_URL= /workspace/build.env | cut -d= -f2-)
        docker build -f frontend/Dockerfile \
          --build-arg "API_URL=$$API_URL" \
          --build-arg "NEXT_PUBLIC_API_URL=$$NEXT_PUBLIC_API_URL" \
          -t $_ARTIFACT_REGISTRY/realitysync-frontend:$BUILD_ID \
          -t $_ARTIFACT_REGISTRY/realitysync-frontend:latest \
          frontend/
        docker push $_ARTIFACT_REGISTRY/realitysync-frontend:latest
        docker push $_ARTIFACT_REGISTRY/realitysync-frontend:$BUILD_ID
    waitFor: ["get-api-url"]

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy realitysync-frontend \
          --image $_ARTIFACT_REGISTRY/realitysync-frontend:latest \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --min-instances 0 \
          --max-instances 10 \
          --timeout 5m
    waitFor: ["build-and-push-frontend"]

substitutions:
  _REGION: us-central1
  _ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/${PROJECT_ID}/realitysync
  _CLOUD_SQL_INSTANCE: ${PROJECT_ID}:us-east1:affordable-gadgets-production-pg

artifacts:
  objects:
    location: gs://${PROJECT_ID}-cloudbuild-logs/builds/
    paths:
      - build.env

timeout: 2400s
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
