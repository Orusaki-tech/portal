steps:
  # ── 1. API Backend ────────────────────────────────────────────
  - id: build-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build -f Dockerfile \
          -t $_ARTIFACT_REGISTRY/realitysync-api:$SHORT_SHA \
          -t $_ARTIFACT_REGISTRY/realitysync-api:latest \
          .
    waitFor: ["-"]

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_ARTIFACT_REGISTRY/realitysync-api:latest
    waitFor: ["build-api"]

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy realitysync-api \
          --image $_ARTIFACT_REGISTRY/realitysync-api:latest \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --add-cloudsql-instances $_CLOUD_SQL_INSTANCE \
          --set-env-vars "DB_HOST=/cloudsql/$_CLOUD_SQL_INSTANCE,DB_NAME=realitysync,APP_ENV=production" \
          --set-secrets "DB_USER=realitysync-db-user:latest,DB_PASSWORD=realitysync-db-password:latest" \
          --min-instances 0 \
          --max-instances 10 \
          --timeout 5m
    waitFor: ["push-api"]

  # ── 2. TiTiler ────────────────────────────────────────────────
  - id: build-titiler
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build -f backend/titiler/Dockerfile \
          -t $_ARTIFACT_REGISTRY/realitysync-titiler:$SHORT_SHA \
          -t $_ARTIFACT_REGISTRY/realitysync-titiler:latest \
          .
    waitFor: ["-"]

  - id: push-titiler
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_ARTIFACT_REGISTRY/realitysync-titiler:latest
    waitFor: ["build-titiler"]

  - id: deploy-titiler
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy realitysync-titiler \
          --image $_ARTIFACT_REGISTRY/realitysync-titiler:latest \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --min-instances 0 \
          --max-instances 5 \
          --timeout 5m
    waitFor: ["push-titiler"]

  # ── 3. Frontend (Next.js) ─────────────────────────────────────
  - id: get-api-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(gcloud run services describe realitysync-api \
          --region $_REGION \
          --format='value(status.url)')
        echo "API_URL=$API_URL" >> /workspace/build.env
        echo "NEXT_PUBLIC_API_URL=$API_URL" >> /workspace/build.env
    waitFor: ["deploy-api"]

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        source /workspace/build.env
        docker build -f frontend/Dockerfile \
          --build-arg API_URL=${API_URL} \
          --build-arg NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} \
          -t $_ARTIFACT_REGISTRY/realitysync-frontend:$SHORT_SHA \
          -t $_ARTIFACT_REGISTRY/realitysync-frontend:latest \
          frontend/
    waitFor: ["get-api-url"]

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_ARTIFACT_REGISTRY/realitysync-frontend:latest
    waitFor: ["build-frontend"]

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy realitysync-frontend \
          --image $_ARTIFACT_REGISTRY/realitysync-frontend:latest \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --min-instances 0 \
          --max-instances 10 \
          --timeout 5m
    waitFor: ["push-frontend"]

substitutions:
  _REGION: us-central1
  _ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/${PROJECT_ID}/realitysync
  _CLOUD_SQL_INSTANCE: ${PROJECT_ID}:us-central1:realitysync-postgis

artifacts:
  objects:
    location: gs://${PROJECT_ID}-cloudbuild-logs/builds/
    paths:
      - build.env

timeout: 2400s
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
