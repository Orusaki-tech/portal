realitysync:
  outputs:
    dev:
      type: postgres
      threads: 4
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('DB_NAME', 'realitysync') }}"
      user: "{{ env_var('DB_USER', 'realitysync') }}"
      password: "{{ env_var('DB_PASSWORD', 'realitysync') }}"
      schema: public

    prod:
      type: postgres
      threads: 8
      host: "{{ env_var('DB_HOST') }}"
      port: "{{ env_var('DB_PORT') | int }}"
      dbname: "{{ env_var('DB_NAME') }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      schema: public

  target: dev
