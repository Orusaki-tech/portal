services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: realitysync-postgis
    environment:
      POSTGRES_DB: realitysync
      POSTGRES_USER: realitysync
      POSTGRES_PASSWORD: realitysync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realitysync -d realitysync"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realitysync-api
    environment:
      DB_HOST: postgis
      DB_PORT: 5432
      DB_NAME: realitysync
      DB_USER: realitysync
      DB_PASSWORD: realitysync
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: realitysync-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install && npm run dev"
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: realitysync-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@realitysync.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgis:
        condition: service_healthy
    profiles:
      - debug

volumes:
  pgdata:
